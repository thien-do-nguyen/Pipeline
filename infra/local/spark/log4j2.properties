status = warn
name = LocalSparkLogging

appenders = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c: %m%n

rootLogger.level = warn
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = console

logger.kafkaAdminConfig.name = org.apache.kafka.clients.admin.AdminClientConfig
logger.kafkaAdminConfig.level = error

logger.processingTimeExecutor.name = org.apache.spark.sql.execution.streaming.ProcessingTimeExecutor
logger.processingTimeExecutor.level = error
