name: lakehouse-batch-cdc-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ecommerce
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
  PGPASSWORD: admin
  PGHOST: localhost
  PGPORT: "5432"
  PGDATABASE: ecommerce
  PGUSER: admin
  CDC_POSTGRES_PASSWORD: cdc-ci-only
  SPARK_LOCAL_IP: 127.0.0.1

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: make setup
      - run: make check

  e2e-batch:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ecommerce"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v5
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-delta-3.2.0-postgresql-42.7.3
      - run: make setup
      - name: Initialize shared PostgreSQL CDC contract
        run: |
          psql --host "$POSTGRES_HOST" --port "$POSTGRES_PORT" \
            --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            --set ON_ERROR_STOP=1 --file schema/oltpSchema.sql
          bash infra/local/postgres/02_cdc.sh
      - name: Verify PostgreSQL CDC Contracts
        run: make test-integration
      - name: Run Batch E2E
        run: make test-e2e-batch

  e2e-streaming:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ecommerce"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v5
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-delta-3.2.0-postgresql-42.7.3
      - run: make setup
      - name: Initialize shared PostgreSQL CDC contract
        run: |
          psql --host "$POSTGRES_HOST" --port "$POSTGRES_PORT" \
            --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            --set ON_ERROR_STOP=1 --file schema/oltpSchema.sql
          bash infra/local/postgres/02_cdc.sh
      - name: Run CDC Streaming E2E
        run: make test-e2e-streaming

  e2e-concurrency:
    needs: [e2e-batch, e2e-streaming]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ecommerce"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v5
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-delta-3.2.0-postgresql-42.7.3
      - run: make setup
      - name: Initialize shared PostgreSQL CDC contract
        run: |
          psql --host "$POSTGRES_HOST" --port "$POSTGRES_PORT" \
            --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
            --set ON_ERROR_STOP=1 --file schema/oltpSchema.sql
          bash infra/local/postgres/02_cdc.sh
      - name: Verify shared Delta writer lock and convergence
        run: make test-e2e-concurrency
