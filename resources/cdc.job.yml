resources:
  jobs:
    ecommerce_cdc:
      name: ecommerce-lakehouse-cdc
      max_concurrent_runs: 1
      run_as:
        user_name: ${var.run_principal}

      # Kept paused by default so destroying Event Hubs cannot accidentally
      # start the shared cluster. Trigger manually or enable the schedule only
      # while the ephemeral CDC infrastructure exists.
      schedule:
        quartz_cron_expression: "0 0/2 * * * ?"
        timezone_id: Asia/Ho_Chi_Minh
        pause_status: PAUSED

      tasks:
        - task_key: process_cdc_available_now
          existing_cluster_id: 0804-071458-pswonf6z
          python_wheel_task:
            package_name: ecommerce_pipeline
            entry_point: ecommerce-cdc-cloud
            parameters:
              - --env
              - ${workspace.file_path}/configs/azure.yaml
              - --base-config
              - ${workspace.file_path}/configs/base.yaml
              - --event-hubs-namespace
              - ${var.event_hubs_namespace}
              - --secret-scope
              - ${var.secret_scope}
              - --postgres-host
              - ${var.postgres_host}
              - --postgres-port
              - ${var.postgres_port}
              - --postgres-database
              - ${var.postgres_database}
              - --postgres-user
              - ${var.postgres_user}
              - --uc-catalog
              - ${var.uc_catalog}
              - --bronze-schema
              - ${resources.schemas.bronze.name}
              - --silver-schema
              - ${resources.schemas.silver.name}
              - --gold-schema
              - ${resources.schemas.gold.name}
              - --external-storage-root
              - ${resources.external_locations.pipeline.url}
          libraries:
            - whl: ../dist/*.whl
