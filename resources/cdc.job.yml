resources:
  jobs:
    ecommerce_cdc:
      name: ecommerce-lakehouse-cdc
      max_concurrent_runs: 1
      run_as:
        user_name: ${var.run_principal}

      parameters:
        - name: validation_mode
          default: runtime
        - name: execution_mode
          default: continuous

      # An always-on Structured Streaming workload avoids repeated job/library
      # startup. Keep it paused until ephemeral Event Hubs and ACI are healthy.
      continuous:
        pause_status: PAUSED

      tasks:
        - task_key: process_cdc
          existing_cluster_id: 0804-071458-pswonf6z
          python_wheel_task:
            package_name: ecommerce_pipeline
            entry_point: ecommerce-cdc-cloud
            parameters:
              - --env
              - ${workspace.file_path}/configs/azure.yaml
              - --base-config
              - ${workspace.file_path}/configs/base.yaml
              - --event-hubs-namespace
              - ${var.event_hubs_namespace}
              - --secret-scope
              - ${var.secret_scope}
              - --postgres-host
              - ${var.postgres_host}
              - --postgres-port
              - ${var.postgres_port}
              - --postgres-database
              - ${var.postgres_database}
              - --postgres-user
              - ${var.postgres_user}
              - --uc-catalog
              - ${var.uc_catalog}
              - --bronze-schema
              - ${resources.schemas.bronze.name}
              - --silver-schema
              - ${resources.schemas.silver.name}
              - --gold-schema
              - ${resources.schemas.gold.name}
              - --external-storage-root
              - ${resources.external_locations.pipeline.url}
              - --validation-mode
              - "{{job.parameters.validation_mode}}"
              - --execution-mode
              - "{{job.parameters.execution_mode}}"
          libraries:
            - whl: ../dist/*.whl
