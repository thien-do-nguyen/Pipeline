environment: azure

postgres:
  sslmode: require

spark:
  configure_delta_package: false
  stop_session: false
  config:
    spark.sql.shuffle.partitions: "4"
    spark.default.parallelism: "4"
    spark.databricks.delta.snapshotPartitions: "2"
    spark.databricks.delta.optimizeWrite.enabled: "true"
    spark.databricks.delta.autoCompact.enabled: "true"

streaming:
  enabled: true
  trigger_interval: 5 seconds
  checkpoint_version: v1
  checkpoint_root: "${DATABRICKS_EXTERNAL_STORAGE_ROOT}/_checkpoints/cdc/not-configured"
  kafka:
    # The cloud entry point replaces these placeholders from task parameters
    # and the Databricks secret scope before constructing the Kafka source.
    source_id: event-hubs-not-configured
    bootstrap_servers: not-configured.servicebus.windows.net:9093
    topic_pattern: "ecommerce\\.domain\\..*"
    starting_offsets: earliest
    fail_on_data_loss: true
    max_offsets_per_trigger: 100000
    options:
      kafka.security.protocol: SASL_SSL
      kafka.sasl.mechanism: PLAIN
      kafka.request.timeout.ms: "60000"
      kafka.session.timeout.ms: "30000"
  silver:
    enabled: true
    # Stable across Event Hubs destroy/apply because the Delta Raw Bronze source
    # is persistent and must not be replayed from version zero each epoch.
    checkpoint_root: "${DATABRICKS_EXTERNAL_STORAGE_ROOT}/_checkpoints/cdc-downstream"
    trigger_interval: 5 seconds
    # v2 replays durable Raw Bronze once after fixing bootstrap commit metadata.
    checkpoint_version: v2
    max_files_per_trigger: 8
    max_bytes_per_trigger: 64m
    gold_reconcile_interval_seconds: 5

lakehouse:
  catalog: "${DATABRICKS_CATALOG}"
  external_root: "${DATABRICKS_EXTERNAL_STORAGE_ROOT}"
  schemas:
    bronze: "${DATABRICKS_BRONZE_SCHEMA}"
    silver: "${DATABRICKS_SILVER_SCHEMA}"
    gold: "${DATABRICKS_GOLD_SCHEMA}"
