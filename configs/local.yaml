environment: local

spark:
  # Bound local concurrency so decoded Debezium JSON cannot exhaust driver heap.
  master: "local[4]"
  configure_delta_package: "${SPARK_CONFIGURE_DELTA_PACKAGE:-true}"
  stop_session: true
  config:
    spark.sql.extensions: io.delta.sql.DeltaSparkSessionExtension
    spark.sql.catalog.spark_catalog: org.apache.spark.sql.delta.catalog.DeltaCatalog
    spark.sql.shuffle.partitions: "4"
    spark.jars: "${SPARK_JARS:-}"
    spark.jars.packages: "${SPARK_JARS_PACKAGES:-org.postgresql:postgresql:42.7.3}"
    spark.ui.enabled: "false"
    spark.ui.showConsoleProgress: "false"
    spark.driver.bindAddress: "127.0.0.1"
    spark.driver.host: "127.0.0.1"
    spark.driver.memory: "2g"
    spark.databricks.delta.snapshotPartitions: "2"
    spark.sql.debug.maxToStringFields: "2000"
    spark.driver.extraJavaOptions: "-Dlog4j2.configurationFile=file:infra/local/spark/log4j2.properties"
    spark.executor.extraJavaOptions: "-Dlog4j2.configurationFile=file:infra/local/spark/log4j2.properties"

lakehouse:
  base_path: data/lakehouse

streaming:
  enabled: true
  trigger_interval: 2 seconds
  # Increment only when intentionally starting a fresh Kafka source epoch.
  checkpoint_version: v3
  checkpoint_root: data/checkpoints
  spark_packages:
    - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.2
  kafka:
    bootstrap_servers: localhost:29092
    topic_pattern: "ecommerce\\.domain\\..*"
    starting_offsets: earliest
    fail_on_data_loss: true
    max_offsets_per_trigger: 100000
  silver:
    enabled: true
    trigger_interval: 5 seconds
    # v3 replays Raw Bronze after fixing foreachBatch writer-session transactions.
    checkpoint_version: v3
    max_files_per_trigger: 4
    reconcile_gold_each_batch: true
    gold_deferred_retry_seconds: 30

coordination:
  # Batch and streaming both trigger the shared, idempotent GoldBuilder under this local writer lock.
  # Keep it in the writable shared data mount so host CLI and Airflow coordinate on the same lock.
  local_lock_path: data/runtime
