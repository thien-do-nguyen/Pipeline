# Shared settings used by every deployment environment.

application:
  name: azure-lakehouse-pipeline
  source_system: ecommerce
  timezone: Asia/Ho_Chi_Minh

postgres:
  host: "${POSTGRES_HOST}"
  port: "${POSTGRES_PORT}"
  database: "${POSTGRES_DB}"
  source_schema: customer_app
  user: "${POSTGRES_USER}"
  password: "${POSTGRES_PASSWORD}"
  sslmode: prefer
  jdbc_driver: org.postgresql.Driver
  fetch_size: 10000
  query_timeout_seconds: 300
  connect_timeout_seconds: 15
  socket_timeout_seconds: 300
  max_jdbc_partitions: 4
  target_events_per_partition: 100000
  max_events_per_batch: 500000
  retry_attempts: 3
  retry_initial_backoff_seconds: 2

spark:
  app_name: lakehouse-pipeline
  max_parallel_tables: 4
  config:
    spark.scheduler.mode: FAIR
    spark.databricks.delta.schema.autoMerge.enabled: "false"
    spark.sql.adaptive.enabled: "true"
    spark.sql.maxPlanStringLength: "524288"
    spark.sql.parquet.datetimeRebaseModeInRead: CORRECTED
    spark.sql.parquet.datetimeRebaseModeInWrite: CORRECTED
    spark.sql.parquet.int96RebaseModeInRead: CORRECTED
    spark.sql.parquet.int96RebaseModeInWrite: CORRECTED

streaming:
  enabled: false
  query_name: ecommerce-cdc-to-bronze
  bronze_table: cdc_events
  checkpoint_version: v1
  trigger_interval: 15 seconds
  silver:
    enabled: false
    query_name: ecommerce-cdc-to-silver
    checkpoint_version: v1
    trigger_interval: 30 seconds
    max_files_per_trigger: 8
    max_bytes_per_trigger: 32m
    reconcile_gold_each_batch: false
    max_gold_readiness_order_ids: 5000
    gold_deferred_retry_seconds: 0
    gold_deferred_retry_interval_seconds: 2

coordination:
  # Keep the deployed batch job as owner until the cloud streaming job is enabled.
  gold_owner: batch
  cloud_lock_name: unified_silver_writer
  cloud_lock_ttl_seconds: 21600
  lock_wait_seconds: 600
